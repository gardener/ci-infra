name: Test Copy-Images Build

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/**
      - images/copy-images/**

jobs:
  build-copy-images:
    name: Build Copy-Images
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'gardener/ci-infra' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build copy-images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./images/copy-images
          file: ./images/copy-images/Dockerfile
          target: copy-images
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
