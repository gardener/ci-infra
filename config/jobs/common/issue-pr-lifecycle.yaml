periodics:
- name: ci-gardener-triage-robot-issue-close
  interval: 1h
  cluster: gardener-prow-trusted
  decorate: true
  reporter_config:
    slack:
      channel: prow-alerts
  annotations:
    description: Closes rotten issues after 60d of inactivity
    testgrid-create-test-group: "false"
  spec:
    containers:
    - image: europe-docker.pkg.dev/gardener-project/releases/ci-infra/commenter:v20261110-4b1fda0
      command:
      - /commenter
      args:
      - |-
        --query=org:gardener
        -repo:gardener/gardener-security-advisories-tracker
        is:issue
        -label:lifecycle/active
        -label:lifecycle/frozen
        label:lifecycle/rotten
      - --updated=1440h
      - --github-app-id=$(GITHUB_APP_ID)
      - --github-app-private-key-path=/etc/github/cert
      - --github-endpoint=http://ghproxy.prow.svc.cluster.local
      - --github-endpoint=https://api.github.com
      - --github-org=gardener
      - |-
        --comment=The Gardener project currently lacks enough active contributors to adequately respond to all issues.
        This bot triages issues according to the following rules:
        - After 90d of inactivity, `lifecycle/stale` is applied
        - After 60d of inactivity since `lifecycle/stale` was applied, `lifecycle/rotten` is applied
        - After 60d of inactivity since `lifecycle/rotten` was applied, the issue is closed

        You can:
        - Reopen this issue with `/reopen`
        - Mark this issue as active with `/lifecycle active`
        - Mark this issue as frozen with `/lifecycle frozen`
        - Mark this issue as fresh with `/remove-lifecycle rotten`

        /close
      - --template
      - --ceiling=10
      - --confirm
      volumeMounts:
      - name: github-app
        mountPath: /etc/github
        readOnly: true
      env:
      - name: GITHUB_APP_ID
        valueFrom:
          secretKeyRef:
            name: commenter-github-app
            key: appid
    volumes:
    - name: github-app
      secret:
        secretName: commenter-github-app

