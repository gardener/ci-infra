periodics:
- name: ci-prow-label-sync
  cron: "17 * * * *"  # Every hour at 17 minutes past the hour
  cluster: gardener-prow-trusted
  labels:
    app: label-sync
  decorate: true
  extra_refs:
  - org: gardener
    repo: ci-infra
    base_ref: master
  reporter_config:
    slack:
      channel: prow-alerts
  annotations:
    description: Runs label_sync to synchronize GitHub repo labels with the label config defined in config/prow/labels.yaml
    testgrid-create-test-group: "false"
  spec:
    containers:
    - image: gcr.io/k8s-staging-test-infra/label_sync:v20260729-f66136c16c
      command:
      - label_sync
      args:
      - --config=config/prow/labels.yaml
      - --confirm=true
      - --orgs=gardener
      - --github-endpoint=http://ghproxy.prow.svc
      - --github-endpoint=https://api.github.com
      - --github-app-id=$(GITHUB_APP_ID)
      - --github-app-private-key-path=/etc/github/cert
      - --debug
      volumeMounts:
      - name: github-app
        mountPath: /etc/github
        readOnly: true
      env:
      - name: GITHUB_APP_ID
        valueFrom:
          secretKeyRef:
            name: github-app
            key: appid
    volumes:
    - name: github-app
      secret:
        secretName: github-app
