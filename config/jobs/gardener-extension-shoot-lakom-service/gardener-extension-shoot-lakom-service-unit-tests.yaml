presubmits:
  gardener/gardener-extension-shoot-lakom-service:
    - name: pull-gardener-extension-shoot-lakom-service-unit
      cluster: gardener-prow-build
      always_run: true
      decorate: true
      decoration_config:
        timeout: 20m
        grace_period: 10m
      annotations:
        description: Runs unit tests for gardener-extension-shoot-lakom-service developments in pull requests
      spec:
        containers:
          - image: europe-docker.pkg.dev/gardener-project/releases/ci-infra/golang-test:v20260827-3dbaa56-1.26
            command:
              - make
            args:
              - import-tools-bin
              - verify-extended
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 2
                memory: 2Gi
periodics:
  - name: ci-gardener-extension-shoot-lakom-service-unit
    cluster: gardener-prow-build
    interval: 4h
    extra_refs:
      - org: gardener
        repo: gardener-extension-shoot-lakom-service
        base_ref: main
    decorate: true
    decoration_config:
      timeout: 20m
      grace_period: 10m
    annotations:
      description: Runs unit tests for gardener-extension-shoot-lakom-service developments periodically
      testgrid-dashboards: gardener-extension-shoot-lakom-service
      testgrid-days-of-results: "60"
    spec:
      containers:
        - image: europe-docker.pkg.dev/gardener-project/releases/ci-infra/golang-test:v20260827-3dbaa56-1.26
          command:
            - make
          args:
            - import-tools-bin
            - verify-extended
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 2
              memory: 2Gi
