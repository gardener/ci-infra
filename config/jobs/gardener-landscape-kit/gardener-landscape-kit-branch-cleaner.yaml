periodics:
- cron: "0 22 * * *"
  name: ci-gardener-landscape-kit-branch-cleaner
  cluster: gardener-prow-trusted
  decorate: true
  annotations:
    description: Clean up release branches of gardener/gardener-landscape-kit
    testgrid-create-test-group: "false"
  reporter_config:
    slack:
      channel: prow-alerts
  spec:
    containers:
    - image: europe-docker.pkg.dev/gardener-project/releases/ci-infra/branch-cleaner:v20260925-f642ef8
      command:
      - /branch-cleaner
      args:
      - --github-app-id=$(GITHUB_APP_ID)
      - --github-app-private-key-path=/etc/github/cert
      - --github-endpoint=http://ghproxy.prow.svc.cluster.local
      - --github-endpoint=https://api.github.com
      - --dry-run=false
      - --repository=gardener/gardener-landscape-kit
      - --branch-pattern=^release-v\d+\.\d+
      - --keep-branches=3
      - --ignore-open-prs=false
      - --release-branch-mode=true
      volumeMounts:
      - name: github-app
        mountPath: /etc/github
        readOnly: true
      env:
      - name: GITHUB_APP_ID
        valueFrom:
          secretKeyRef:
            name: github-app
            key: appid
    volumes:
    - name: github-app
      secret:
        secretName: github-app
