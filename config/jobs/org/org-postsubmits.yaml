postsubmits:
  gardener/org:
  - name: post-org-owners-aliases-bumper
    cluster: gardener-prow-trusted
    branches:
    - ^main$
    run_if_changed: '^config/org\.yaml$'
    decorate: true
    annotations:
      description: Bumps OWNERS_ALIASES in all configured repos to match the Peribolos config.
      testgrid-create-test-group: "false"
    spec:
      containers:
      - image: europe-docker.pkg.dev/gardener-project/releases/ci-infra/owners-aliases-bumper:v20260925-f642ef8
        command:
        - /owners-aliases-bumper
        args:
        - --peribolos-conf=config/org.yaml
        - --git-email="gardener.ci.robot@gmail.com"
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --github-endpoint=http://ghproxy.prow.svc.cluster.local
        - --github-endpoint=https://api.github.com
        - --confirm
        volumeMounts:
        - name: github-app
          mountPath: /etc/github
          readOnly: true
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: github-app
              key: appid
      volumes:
      - name: github-app
        secret:
          secretName: github-app
