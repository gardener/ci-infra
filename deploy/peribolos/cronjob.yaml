apiVersion: batch/v1
kind: CronJob
metadata:
  name: peribolos
  namespace: peribolos
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/instance: peribolos
        app.kubernetes.io/name: peribolos
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: peribolos
            app.kubernetes.io/name: peribolos
        spec:
          containers:
          - name: peribolos
            image: us-docker.pkg.dev/k8s-infra-prow/images/peribolos:v20260924-f21dfc59d
            args:
            - --min-admins=5
            - --require-self
            - --config-path=/etc/config/org.yaml
            - --github-app-id=$(GITHUB_APP_ID)
            - --github-app-private-key-path=/etc/github/cert
            - --github-hourly-tokens=0
            - --github-allowed-burst=0
            - --ignore-secret-teams
            - --ignore-enterprise-teams
            - --fix-org
            - --fix-org-members
            - --fix-teams
            - --fix-team-members
            - --fix-team-repos
            - --fix-repos
            - --fix-collaborators
            - --allow-repo-archival
            - --confirm
            volumeMounts:
            - name: github-app
              mountPath: /etc/github
              readOnly: true
            - name: peribolos-config
              mountPath: /etc/config
              readOnly: true
            env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: appid
          restartPolicy: Never
          volumes:
          - name: github-app
            secret:
              secretName: github-app
          - name: peribolos-config
            configMap:
              name: peribolos-config
  schedule: '0 * * * *'
  successfulJobsHistoryLimit: 10
  suspend: false
