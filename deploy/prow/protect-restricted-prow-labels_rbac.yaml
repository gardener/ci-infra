apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: prow
  name: protect-restricted-prow-labels
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: prow
  name: protect-restricted-prow-labels
rules:
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - create
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    resourceNames:
    - protect-restricted-prow-labels
    verbs:
    - get
    - update
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: prow
  name: protect-restricted-prow-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protect-restricted-prow-labels
subjects:
- kind: ServiceAccount
  name: protect-restricted-prow-labels
